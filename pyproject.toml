[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "genotox-food-migrants"
version = "0.2.0"
description = "Transparent compound-identity uncertainty scenarios using EFSA conclusion labels"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Ana Bossler"}]
keywords = ["cheminformatics", "genotoxicity", "identity uncertainty", "marimo"]
dependencies = [
    "lightgbm==4.7.0", "matplotlib==3.11.2", "numpy==2.5.3",
    "openpyxl==3.1.5", "pandas==3.0.6", "pyarrow==25.0.1",
    "rdkit==2026.3.6", "scikit-learn==1.9.1", "scipy==1.18.1",
]

[project.optional-dependencies]
notebook = ["marimo==0.24.2", "anywidget==0.11.0"]
test-ui = ["playwright==1.52.0"]

[project.urls]
Repository = "https://github.com/E4CE-UA/genotox-food-migrants"

# A single canonical implementation lives in src/. The installed namespace is
# unambiguous; data is private to that namespace. setup.py copies release assets.
[tool.setuptools]
packages = ["genotox_food_migrants"]
package-dir = {genotox_food_migrants = "src"}

[tool.setuptools.package-data]
genotox_food_migrants = ["_data/**/*", "_validation/**/*"]
